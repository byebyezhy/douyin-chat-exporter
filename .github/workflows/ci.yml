name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check least-privilege manifest
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build extension
        run: npm run build
      - name: Package separate standard and enhanced variants
        run: |
          cd dist/extension
          zip -qr ../douyin-chat-exporter-standard.zip .
          cd ../extension-enhanced
          zip -qr ../douyin-chat-exporter-enhanced.zip .
      - name: Upload least-privileged standard extension
        uses: actions/upload-artifact@v6
        with:
          name: douyin-chat-exporter-standard
          path: dist/douyin-chat-exporter-standard.zip
          retention-days: 14
      - name: Upload native-voice enhanced extension
        uses: actions/upload-artifact@v6
        with:
          name: douyin-chat-exporter-enhanced
          path: dist/douyin-chat-exporter-enhanced.zip
          retention-days: 14
