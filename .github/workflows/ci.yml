name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check least-privilege manifest
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build extension
        run: npm run build
      - name: Package Windows-installable extension directory
        run: |
          cd dist/extension
          zip -qr ../douyin-chat-exporter-extension.zip .
      - name: Upload test artifact
        uses: actions/upload-artifact@v6
        with:
          name: douyin-chat-exporter-extension
          path: dist/douyin-chat-exporter-extension.zip
          retention-days: 14
