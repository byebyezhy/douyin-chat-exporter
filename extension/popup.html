<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抖音聊天导出助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>抖音聊天导出助手</h1>
      <span class="badge">M0 开发预览</span>
    </header>
    <p>当前仅检测网页版基本结构，<strong>暂不导出消息</strong>，也不会读取聊天正文。</p>
    <button type="button" id="diagnose">检测当前页面</button>
    <div id="status" role="status" aria-live="polite">请先打开抖音网页版并登录。</div>
    <pre id="result" hidden></pre>
    <p class="hint">请在聊天窗口检测一次，再向上滚动几屏后重新检测。比较两个滚动区域的 scrollTop；结果不包含聊天正文。不要分享 Cookie 或 HAR。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
