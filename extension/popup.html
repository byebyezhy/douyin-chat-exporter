<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抖音聊天导出助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>抖音聊天导出助手</h1>
      <span class="badge">v0.3.1 候选版</span>
    </header>
    <p>单会话自动滚动、聊天文字与语音转写、简洁 TXT/HTML 阅读版。<strong>完整性未验证时会明确提示。</strong></p>
    <button type="button" id="full-export">启动 v0.3.1 自动导出</button>
    <button type="button" id="voice-enable" class="secondary-action" hidden>开启增强语音鼠标操作</button>
    <button type="button" id="voice-disable" class="secondary-action" hidden>关闭增强语音鼠标操作</button>
    <p id="voice-permission-state" class="hint">正在检测安装版本……</p>
    <button type="button" id="diagnose" class="secondary-action">检测当前页面（诊断）</button>
    <button type="button" id="monitor" class="secondary-action">开始连续索引测试</button>
    <button type="button" id="capture" class="secondary-action">开始本地聊天文字采集（实验）</button>
    <div id="status" role="status" aria-live="polite">请先打开抖音网页版并登录。</div>
    <pre id="result" hidden></pre>
    <p class="hint">普通版无调试权限；增强版只在安装时请求 debugger 强权限，操作开关不能撤销已安装权限，若需撤销请卸载增强版并使用普通版。不要同时安装两版。断点仅留在浏览器本地；请勿上传私人聊天记录。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
