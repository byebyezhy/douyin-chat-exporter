<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抖音聊天导出助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>抖音聊天导出助手</h1>
      <span class="badge">M0 开发预览</span>
    </header>
    <p>当前仅检测网页版基本结构，<strong>暂不导出消息</strong>，也不会读取聊天正文。</p>
    <button type="button" id="diagnose">检测当前页面</button>
    <div id="status" role="status" aria-live="polite">请先打开抖音网页版并登录。</div>
    <pre id="result" hidden></pre>
    <p class="hint">结果新增 chatCandidateIndex 和 chatStructure，供开发阶段定位消息节点。不会读取聊天正文或属性值；不要分享 Cookie 或 HAR。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
