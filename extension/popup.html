<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抖音聊天导出助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>抖音聊天导出助手</h1>
      <span class="badge">M1 实验预览</span>
    </header>
    <p>已验证连续列表索引监听。新功能可<strong>在本地试采集可见聊天文字</strong>，仍未验证完整历史与语音。</p>
    <button type="button" id="diagnose">检测当前页面</button>
    <button type="button" id="monitor" class="secondary-action">开始连续索引测试</button>
    <button type="button" id="capture" class="secondary-action">开始本地聊天文字采集（实验）</button>
    <div id="status" role="status" aria-live="polite">请先打开抖音网页版并登录。</div>
    <pre id="result" hidden></pre>
    <p class="hint">索引测试只记录数字。本地文字采集会读取当前会话的可见文字并在本机下载 JSON/TXT，不联网发送；请勿把含私聊的文件发到公开仓库。两种测试请分开运行。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
